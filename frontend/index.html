<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashSharing</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    (function () {
      var t = localStorage.getItem("theme") || "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body data-page="index">
<div class="container">

  <header class="banner">
    <a href="/" class="brand">CashSharing</a>
    <span class="banner-spacer"></span>
    <span id="me-label" class="me-label" hidden></span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
    <button id="logout-btn" class="link" hidden>Log out</button>
  </header>

  <section id="login-view" hidden>
    <div class="hero">
      <h1>CashSharing</h1>
      <p>Split expenses with friends and settle up.</p>
    </div>
    <div class="card narrow">
      <div class="auth-tabs">
        <button type="button" id="show-login" class="tab active">Log in</button>
        <button type="button" id="show-register" class="tab">Create account</button>
      </div>
      <form id="login-form" hidden>
        <input name="email" type="email" placeholder="Email" autocomplete="email" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <p class="error" id="login-error"></p>
        <button type="submit">Log in</button>
      </form>
      <form id="register-form" hidden>
        <input name="email" type="email" placeholder="Email" autocomplete="email" required>
        <input name="password" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" required>
        <p class="error" id="register-error"></p>
        <button type="submit">Create account</button>
      </form>
    </div>
  </section>

  <section id="app-view" hidden>
    <div id="name-prompt" class="card narrow" hidden>
      <h2>What should we call you?</h2>
      <form id="name-form" class="row">
        <input name="name" placeholder="Your name" maxlength="64" required>
        <button type="submit">Save</button>
      </form>
      <p class="error" id="name-error"></p>
    </div>

    <div id="totals-bar" class="totals" hidden></div>

    <ul id="group-list" class="group-list"></ul>

    <button id="add-group-btn" class="add-group" type="button">+ Add group</button>
    <form id="new-group-form" class="card narrow" hidden>
      <div class="row">
        <input name="name" placeholder="Group name" required>
        <select name="currency" id="currency-select" title="Currency">
          <option value="ZAR" selected>ZAR</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="AUD">AUD</option>
          <option value="CAD">CAD</option>
          <option value="JPY">JPY</option>
          <option value="CHF">CHF</option>
          <option value="NZD">NZD</option>
        </select>
        <button type="submit">Create</button>
      </div>
    </form>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
