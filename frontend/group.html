<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashSharing</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="group">
<div class="container">

  <header class="topbar">
    <button id="back-link" class="link">&larr; Groups</button>
    <h1 id="group-name">Group</h1>
    <button id="logout-btn" class="link">Log out</button>
  </header>

  <section class="cards">
    <div class="card">
      <h3>Balances</h3>
      <ul id="balances" class="kv"></ul>
    </div>
    <div class="card">
      <h3>Settlements</h3>
      <ul id="settlements" class="kv"></ul>
    </div>
    <div class="card">
      <h3>Total spend</h3>
      <p id="total-spend" class="big">R 0.00</p>
    </div>
  </section>

  <section>
    <h2>Spending by tag</h2>
    <ul id="tag-totals" class="kv"></ul>
  </section>

  <section>
    <h2>Transactions</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th>Tag</th>
            <th>Amount</th>
            <th>Paid by</th>
            <th>Split</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="txn-body"></tbody>
      </table>
    </div>
    <p class="muted" id="txn-empty" hidden>No transactions yet.</p>
  </section>

  <section>
    <h2>Add transaction</h2>
    <form id="new-txn-form" class="card">
      <div class="row">
        <input name="description" placeholder="Description" required>
        <input name="total_amount" type="number" min="0.01" step="0.01" placeholder="Total amount" required>
        <select name="tag" id="tag-select" required></select>
        <select name="paid_by" id="paid-by-select" required></select>
      </div>
      <div id="split-row" class="split-row"></div>
      <button type="submit">Add transaction</button>
    </form>
  </section>

  <section>
    <h2>Members</h2>
    <ul id="member-list" class="chips"></ul>
    <form id="add-member-form" class="card narrow">
      <div class="row">
        <input name="username" placeholder="Username to add" required>
        <button type="submit">Add member</button>
      </div>
    </form>
  </section>

  <section>
    <h2>Tags</h2>
    <div id="tag-list" class="chips"></div>
    <form id="new-tag-form" class="card narrow">
      <div class="row">
        <input name="tag" placeholder="New tag" required>
        <button type="submit">Add tag</button>
      </div>
    </form>
  </section>

</div>
<script src="/app.js"></script>
</body>
</html>
