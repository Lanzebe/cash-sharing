name: Build and push CashSharing

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lowercase repository name
        run: echo "CASH_SHARING_IMAGE=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.CASH_SHARING_IMAGE }}:latest
            ghcr.io/${{ env.CASH_SHARING_IMAGE }}:${{ github.sha }}